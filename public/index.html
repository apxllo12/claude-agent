<!DOCTYPE html>
<html>
<head>
  <title>Claude Agent + QR Verifier</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    body { font-family: Arial; max-width: 800px; margin: 50px auto; padding: 20px; }
    #canvas, video { width: 100%; max-width: 400px; height: 400px; border: 2px solid #ddd; }
    button { background: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; margin: 10px; }
    button:hover { background: #0056b3; }
    .success { background: #d4edda; color: #155724; padding: 15px; border-radius: 5px; }
    .pending { background: #fff3cd; color: #856404; padding: 15px; border-radius: 5px; }
    #accounts { margin-top: 30px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
  </style>
</head>
<body>
  <h1>🚀 Claude Account Agent + QR Verifier</h1>
  
  <h2>📱 QR Code Scanner</h2>
  <input type="file" id="qrInput" accept="image/*">
  <video id="video" autoplay muted style="display:none;"></video>
  <canvas id="canvas" style="display:none;"></canvas>
  <br>
  <button onclick="scanImage()">🔍 Scan QR Image</button>
  <button onclick="startCamera()">📹 Webcam Scan</button>
  
  <div id="qrStatus" class="pending" style="display:none;">⏳ Scanning...</div>
  <div id="qrResult"></div>
  
  <h2>🤖 Create Claude Account</h2>
  <button onclick="createClaudeAccount()">➕ Create New Claude Account</button>
  <div id="accountStatus"></div>
  
  <h2>📊 Accounts Created</h2>
  <div id="accounts"></div>

  <script>
    const API_URL = '/api'; // Railway auto-sets this
    
    async function scanImage() {
      const file = document.getElementById('qrInput').files[0];
      if (!file) return alert('Select QR image first');
      
      document.getElementById('qrStatus').style.display = 'block';
      document.getElementById('qrStatus').innerHTML = '⏳ Scanning QR...';
      
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();
      
      img.onload = async () => {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        
        if (code) {
          document.getElementById('qrResult').innerHTML = `<strong>QR Data:</strong> ${code.data}`;
          await verifyQR(code.data);
        } else {
          document.getElementById('qrStatus').innerHTML = '❌ No QR code found';
        }
      };
      img.src = URL.createObjectURL(file);
    }
    
    async function startCamera() {
      const video = document.getElementById('video');
      video.style.display = 'block';
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment' } 
        });
        video.srcObject = stream;
        
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function scanLoop() {
          if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);
            
            if (code) {
              document.getElementById('qrResult').innerHTML = `<strong>QR Data:</strong> ${code.data}`;
              verifyQR(code.data);
              return;
            }
          }
          requestAnimationFrame(scanLoop);
        }
        scanLoop();
      } catch (err) {
        alert('Camera access denied');
      }
    }
    
    async function verifyQR(qrData) {
      document.getElementById('qrStatus').innerHTML = '✅ Verifying QR...';
      
      const response = await fetch(`${API_URL}/scan-qr`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ qrData })
      });
      
      const result = await response.json();
      document.getElementById('qrStatus').innerHTML = result.status || '✅ Verified!';
      document.getElementById('qrStatus').className = 'success';
    }
    
    async function createClaudeAccount() {
      document.getElementById('accountStatus').innerHTML = '⏳ Creating Claude account...';
      
      const response = await fetch(`${API_URL}/create-claude`, {
        method: 'POST'
      });
      
      const result = await response.json();
      if (result.success) {
        document.getElementById('accountStatus').innerHTML = 
          `<div class="success">✅ New account: ${result.account.email}:${result.account.password}</div>`;
        loadAccounts();
      }
    }
    
    async function loadAccounts() {
      // TODO: Fetch from /api/accounts
      document.getElementById('accounts').innerHTML = '<p>Accounts will appear here</p>';
    }
    
    loadAccounts();
  </script>
</body>
</html>
